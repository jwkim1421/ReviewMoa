<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 300px; margin: 0; padding: 20px; color: #27241f; background: #f7f4ed; font: 14px/1.55 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { color: #686158; }
      .state { margin-top: 16px; padding: 12px; border-radius: 10px; background: white; }
      strong { color: #315c4c; }
      button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 8px; color: white; background: #27241f; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>리뷰모아 도우미</h1>
    <p>리뷰모아에서 상품 URL을 입력하면 이 확장 프로그램이 열린 상품 페이지의 공개 리뷰를 확인합니다.</p>
    <div class="state" id="state">진행 중인 작업을 확인하고 있어요.</div>
    <button id="resume">현재 페이지에서 다시 확인</button>
    <script src="popup.js"></script>
  </body>
</html>
